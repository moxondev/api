name: moxon docker image

on:
    release:
        types: [published]
    push:
        branches: ["master"]
    workflow_dispatch:

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci
            - run: npm run check
            - run: npm test

    image:
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            - uses: docker/setup-qemu-action@v4
            - uses: docker/setup-buildx-action@v4

            # Tags on a release (semver, latest) and on master (edge), any other run only builds
            - uses: docker/metadata-action@v6
              id: meta
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=edge,branch=master

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: moxon-smoke
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test
              run: |
                  docker run -d --name smoke --read-only --tmpfs /tmp -p 3000:3000 \
                    -e CHALLENGE_SECRET=smoke-test-secret moxon-smoke

                  for i in $(seq 1 30); do
                    curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && break
                    sleep 1
                  done

                  curl -fsS http://127.0.0.1:3000/ | grep -q versions
                  curl -fsS "http://127.0.0.1:3000/v6/badge?label=docker" | grep -q "<svg"
                  curl -fsS -D - -o /dev/null http://127.0.0.1:3000/v4/captcha | grep -qi "content-type: image/png"

                  docker exec smoke fc-list | grep -qi dejavu
                  if docker logs smoke 2>&1 | grep -i "fontconfig error"; then exit 1; fi

                  for i in $(seq 1 40); do
                    state="$(docker inspect --format '{{.State.Health.Status}}' smoke)"
                    [ "$state" = healthy ] && break
                    sleep 2
                  done
                  [ "$state" = healthy ] || { docker logs smoke; exit 1; }

                  start="$(date +%s)"
                  docker stop smoke >/dev/null
                  [ "$(( $(date +%s) - start ))" -lt 8 ] || { echo "Slow stop, SIGTERM is not forwarded"; exit 1; }

            - uses: docker/login-action@v4
              if: steps.meta.outputs.tags != ''
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: ${{ steps.meta.outputs.tags != '' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # The arm64 image runs under emulation, its canvas binary must load and draw
            - name: Check the arm64 image
              if: steps.meta.outputs.tags != ''
              run: |
                  image="$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
                  docker run --rm --platform linux/arm64 "$image" node -e "
                    import('canvas').then(({ createCanvas }) => {
                      const ctx = createCanvas(40, 20).getContext('2d');
                      ctx.font = '12px sans-serif';
                      ctx.fillText('ok', 2, 12);
                      console.log(process.arch, 'canvas draws');
                    });
                  " | grep -q "arm64 canvas draws"
